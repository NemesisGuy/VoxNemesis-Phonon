<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Phonon audio diagnostic</title>
</head>

<body>
    <pre id="out">running...</pre>
    <script type="module">
        import { PhononTTS } from '../lib/phonon-tts/index.js';

        const out = document.getElementById('out');
        const log = (...args) => {
            out.textContent += '\n' + args.map((a) => (typeof a === 'string' ? a : JSON.stringify(a))).join(' ');
        };

        function stats(pcm) {
            let min = Infinity;
            let max = -Infinity;
            let sum = 0;
            let nan = 0;
            for (let i = 0; i < pcm.length; i += 1) {
                const v = pcm[i];
                if (!Number.isFinite(v)) { nan += 1; continue; }
                if (v < min) min = v;
                if (v > max) max = v;
                sum += v * v;
            }
            const rms = pcm.length ? Math.sqrt(sum / pcm.length) : 0;
            return {
                len: pcm.length,
                min: Number.isFinite(min) ? Number(min.toFixed(6)) : null,
                max: Number.isFinite(max) ? Number(max.toFixed(6)) : null,
                rms: Number(rms.toFixed(6)),
                nan,
                head: Array.from(pcm.slice(0, 6)).map((v) => Number(v.toFixed(6)))
            };
        }

        function encodeWav(pcm, sampleRate) {
            const buffer = new ArrayBuffer(44 + pcm.length * 2);
            const view = new DataView(buffer);
            const str = (off, s) => { for (let i = 0; i < s.length; i += 1) view.setUint8(off + i, s.charCodeAt(i)); };
            str(0, 'RIFF'); view.setUint32(4, 36 + pcm.length * 2, true); str(8, 'WAVE');
            str(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true);
            view.setUint16(22, 1, true); view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true);
            str(36, 'data'); view.setUint32(40, pcm.length * 2, true);
            for (let i = 0; i < pcm.length; i += 1) {
                const s = Math.max(-1, Math.min(1, pcm[i]));
                view.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);
            }
            return buffer;
        }

        /** Exactly what offscreen.js does, so the diagnostic measures the real path. */
        function scheduleChunk(ctx, pcm, state) {
            const buffer = ctx.createBuffer(1, pcm.length, ctx.sampleRate);
            buffer.copyToChannel(pcm, 0);
            const source = ctx.createBufferSource();
            source.buffer = buffer;
            source.connect(state.gain);
            const startAt = Math.max(state.nextStartTime, ctx.currentTime);
            source.start(startAt);
            state.nextStartTime = startAt + buffer.duration;
            return buffer;
        }

        async function run(texts, device) {
            const results = { device, sampleRate: null, ctxSampleRate: null, runs: [] };
            const tts = await PhononTTS.load({
                lang: 'en',
                device: device || 'auto',
                model: 'hf://gradium/phonon-31m-en@8c64b55ec301728e2d1695bfea87a08a267d0c2d'
            });
            results.sampleRate = tts.sampleRate;
            results.engineDevice = tts.device;
            results.threads = tts.threads;

            const ctx = new AudioContext({ sampleRate: tts.sampleRate });
            results.ctxSampleRate = ctx.sampleRate;
            results.ctxStateAtStart = ctx.state;
            const gain = ctx.createGain();
            gain.connect(ctx.destination);
            const state = { gain, nextStartTime: 0 };

            for (const entry of texts) {
                const raw = [];
                const scheduled = [];
                const speech = tts.stream(entry.text, { voice: 'default' });
                for await (const pcm of speech) {
                    raw.push(pcm);
                    const buf = scheduleChunk(ctx, pcm, state);
                    scheduled.push({ len: buf.length, rate: buf.sampleRate, stats: stats(buf.getChannelData(0)) });
                }
                const statsDone = await speech.done.catch(() => null);

                const total = raw.reduce((a, p) => a + p.length, 0);
                const merged = new Float32Array(total);
                let off = 0;
                for (const p of raw) { merged.set(p, off); off += p.length; }

                // Does the scheduled buffer hold exactly what the model produced?
                let mismatch = 0;
                let cursor = 0;
                for (const s of scheduled) {
                    const p = raw[cursor];
                    cursor += 1;
                    if (!p || p.length !== s.len) { mismatch += 1; continue; }
                    const b = s.stats;
                    if (Math.abs(b.rms - stats(p).rms) > 1e-6) mismatch += 1;
                }

                results.runs.push({
                    label: entry.label,
                    chunkCount: raw.length,
                    chunkLens: raw.map((p) => p.length),
                    rawStats: raw.map((p) => stats(p)),
                    totalSamples: total,
                    durationSeconds: total / tts.sampleRate,
                    mergedStats: stats(merged),
                    scheduledMismatch: mismatch,
                    firstAudioMs: statsDone ? statsDone.firstAudioMs : null,
                    totalMs: statsDone ? statsDone.totalMs : null,
                    chunks: statsDone ? statsDone.chunks : null,
                    wav: Array.from(new Uint8Array(encodeWav(merged, tts.sampleRate)))
                });
            }

            await ctx.close();
            return results;
        }

        window.runDiagnostic = async (texts, device) => {
            try {
                const result = await run(texts, device);
                out.textContent = 'done';
                return result;
            } catch (err) {
                out.textContent = 'error: ' + err.message;
                return { error: err.message, stack: err.stack };
            }
        };
    </script>
</body>

</html>
